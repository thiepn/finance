name: Finance P29 Activity React QA
on:
  pull_request:
    paths:
      - "src/activity/**"
      - "p29-activity-preview.html"
      - "scripts/capture-finance-p29.mjs"
      - ".github/workflows/finance-p29-activity-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activity-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated browser tools
        run: |
          npm install --no-save --no-package-lock playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Test P29 React ledger in browser
        run: node scripts/capture-finance-p29.mjs
      - name: Publish anonymous QA gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-p29-activity-react-qa
          path: p29-artifacts/
          retention-days: 14
          if-no-files-found: warn
