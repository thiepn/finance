name: Finance P28 Home Visual QA
on:
  pull_request:
    paths:
      - "src/overview/**"
      - "src/ui/v2/**"
      - "p28-home-preview.html"
      - "scripts/capture-finance-p28.mjs"
      - ".github/workflows/finance-p28-home-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser audit dependencies
        run: |
          npm install --no-save --no-package-lock playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Capture and qualify actual P28 React Home
        run: node scripts/capture-finance-p28.mjs
      - name: Upload synthetic screenshots and QA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-p28-home-visual-qa
          path: p28-artifacts/
          retention-days: 14
          if-no-files-found: warn
