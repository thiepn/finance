name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: finance-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:ia
      - run: npm run validate:p25
      - run: npm run validate:p25l
      - run: npm run validate:p26
      - run: npm run validate:p27
      - run: npm run validate:p28
      - run: npm run validate:p29
      - run: npm run validate:p30
      - run: npm run validate:p31
      - run: npm run validate:p32
      - run: npm run validate:p33
      - run: npm run validate:p34
      - run: npm run validate:p35
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
