name: Finance P27 Navigation and Auth QA
on:
  pull_request:
    paths:
      - "src/app/**"
      - "src/ui/v2/FinanceV2Shell.tsx"
      - "src/ui/v2/finance-app-shell.css"
      - "src/integrations/supabase-client.ts"
      - "vercel.json"
      - "scripts/capture-finance-p27.mjs"
      - ".github/workflows/finance-p27-navigation-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated Chromium tools
        run: |
          npm install --no-save --no-package-lock playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Test canonical routing and anonymous auth boundary
        run: node scripts/capture-finance-p27.mjs
      - name: Upload anonymous navigation captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-p27-navigation-qa
          path: p27-artifacts/
          retention-days: 14
          if-no-files-found: warn
