name: Finance P26 React Visual QA

on:
  pull_request:
    paths:
      - "src/ui/v2/**"
      - "p26-showcase.html"
      - "scripts/capture-finance-p26.mjs"
      - ".github/workflows/finance-p26-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install temporary browser audit dependencies
        run: |
          npm install --no-save --no-package-lock playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Capture and test actual React component showcase
        run: node scripts/capture-finance-p26.mjs
      - name: Upload screenshot gallery and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-p26-react-visual-qa
          path: p26-artifacts/
          retention-days: 14
          if-no-files-found: warn
