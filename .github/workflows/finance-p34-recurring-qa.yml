name: Finance P34 Recurring React QA
on:
  pull_request:
    paths:
      - "src/recurring/**"
      - "src/app/FinanceAppV2.tsx"
      - "p34-recurring-preview.html"
      - "scripts/capture-finance-p34.mjs"
      - ".github/workflows/finance-p34-recurring-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recurring-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated Chromium browser and axe
        run: |
          npm install --no-save --no-package-lock playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Test actual recurring React components and anti-write safeguards
        run: node scripts/capture-finance-p34.mjs
      - name: Save synthetic evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-p34-recurring-react-qa
          path: p34-artifacts/
          retention-days: 14
          if-no-files-found: warn
