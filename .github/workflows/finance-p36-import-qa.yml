name: Finance P36 Import React QA
on:
  pull_request:
    paths:
      - "src/imports/**"
      - "src/app/FinanceAppV2.tsx"
      - "p36-import-preview.html"
      - "scripts/capture-finance-p36.mjs"
      - ".github/workflows/finance-p36-import-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated Chromium and axe
        run: |
          npm install --no-save --no-package-lock playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Test source-intake React, authorizations and mobile accessibility
        run: node scripts/capture-finance-p36.mjs
      - name: Archive synthetic QA screenshots and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-p36-import-react-qa
          path: p36-artifacts/
          retention-days: 14
          if-no-files-found: warn
