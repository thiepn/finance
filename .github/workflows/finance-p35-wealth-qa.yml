name: Finance P35 Wealth React QA
on:
  pull_request:
    paths:
      - "src/wealth/**"
      - "src/app/FinanceAppV2.tsx"
      - "p35-wealth-preview.html"
      - "scripts/capture-finance-p35.mjs"
      - ".github/workflows/finance-p35-wealth-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wealth-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated Chromium and accessibility checks
        run: |
          npm install --no-save --no-package-lock playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Test real React components and non-mutating default
        run: node scripts/capture-finance-p35.mjs
      - name: Archive synthetic screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-p35-wealth-react-qa
          path: p35-artifacts/
          retention-days: 14
          if-no-files-found: warn
