
name: Finance P32 Insights React QA
on:
  pull_request:
    paths:
      - "src/spending-explorer/**"
      - "p32-insights-preview.html"
      - "scripts/capture-finance-p32.mjs"
      - ".github/workflows/finance-p32-insights-qa.yml"
      - "src/app/FinanceAppV2.tsx"
      - "src/app/finance-router.ts"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  insights-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --no-package-lock playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Capture actual Insights React component, synthetic fixtures
        run: node scripts/capture-finance-p32.mjs
      - name: Save synthetic captures and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-p32-insights-react-qa
          path: p32-artifacts/
          retention-days: 14
          if-no-files-found: warn
