name: Finance P33 Product Merchant React QA
on:
  pull_request:
    paths:
      - "src/product-intelligence/**"
      - "src/app/FinanceAppV2.tsx"
      - "p33-intelligence-preview.html"
      - "scripts/capture-finance-p33.mjs"
      - ".github/workflows/finance-p33-intelligence-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intelligence-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated Chromium tools
        run: |
          npm install --no-save --no-package-lock playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Test actual components with synthetic evidence
        run: node scripts/capture-finance-p33.mjs
      - name: Publish review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-p33-product-merchant-react-qa
          path: p33-artifacts/
          retention-days: 14
          if-no-files-found: warn
