name: Finance P37 Acceptance React QA
on:
  pull_request:
    paths:
      - "src/acceptance/**"
      - "src/app/FinanceAppV2.tsx"
      - "src/app/finance-router.ts"
      - "src/ui/v2/FinanceV2Shell.tsx"
      - "p37-acceptance-preview.html"
      - "scripts/capture-finance-p37.mjs"
      - ".github/workflows/finance-p37-acceptance-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated Chromium accessibility dependencies
        run: |
          npm install --no-save --no-package-lock playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Test real release review and fail-closed synthetic approval
        run: node scripts/capture-finance-p37.mjs
      - name: Archive synthetic read-only visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-p37-release-acceptance-react-qa
          path: p37-artifacts/
          retention-days: 14
          if-no-files-found: warn
